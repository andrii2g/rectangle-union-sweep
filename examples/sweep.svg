<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="865" viewBox="0 0 1080 865" role="img" aria-labelledby="title desc">
<title id="title">Rectangle union: sweep-line progression</title>
<desc id="desc">Panels show coverage after processing all events at each selected X coordinate. Blue bars indicate covered Y intervals. Orange marks the preceding slab.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17243a} .small{font-size:12px} .label{font-size:15px}</style>
<rect width="1080" height="865" fill="#eef3f8"/>
<text x="24" y="34" font-size="24" font-weight="bold">Rectangle union / sweep-line progression</text>
<text x="24" y="61" class="label">Union: 48 | Individual sum: 54 | Overlap savings: 6</text>
<text x="24" y="84" class="small">After X-events: blue rectangles = active; blue side bars = covered Y; orange = preceding slab.</text>
<text x="24" y="104" class="small">Y increases upward. Event groups may be sampled; each slab refers to the immediately preceding event.</text>
<g transform="translate(20,120)">
<rect width="510" height="350" rx="10" fill="white" stroke="#d7e1ec"/>
<text x="16" y="25" font-size="17" font-weight="bold">Frame 1: x = 0</text>
<text x="16" y="47" class="small">Accumulated area: 0</text>
<rect x="34" y="85" width="380" height="175" fill="#f8fafc" stroke="#a9b6c8"/>
<rect x="34.000" y="85" width="0.000" height="175" fill="#f59e0b" fill-opacity=".18"/>

<rect x="34.000" y="160.000" width="253.333" height="100.000" fill="#2563eb" fill-opacity=".20" stroke="#2563eb" stroke-width="1.2"/>
<rect x="160.667" y="85.000" width="253.333" height="125.000" fill="#64748b" fill-opacity=".06" stroke="#64748b" stroke-width="1.2"/>
<line x1="34.000" y1="76" x2="34.000" y2="268" stroke="#e11d48" stroke-width="2"/>
<text x="433" y="75" class="small">Y cover</text>
<rect x="450" y="160.000" width="16" height="100.000" fill="#2563eb"/>
<text x="16" y="290" class="small">Preceding slab [0, 0): area 0</text>
<text x="16" y="310" class="small">Covered Y-length for next slab: 4</text>
<text x="16" y="330" font-size="10">Bounds: x [0, 9], y [0, 7]</text>
</g>
<g transform="translate(550,120)">
<rect width="510" height="350" rx="10" fill="white" stroke="#d7e1ec"/>
