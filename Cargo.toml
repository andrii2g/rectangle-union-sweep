[package]
name = "rectangle-union-sweep"
version = "0.1.0"
edition = "2024"
description = "Exact rectangle union area with a sweep line and coverage segment tree"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "union_area"
harness = false
